<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Météo Chevaux</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f4f1ea; --card:#fff; --ink:#22261f; --mute:#6b6f66; --line:#e3ded2;
  --green:#1a1a1a; --green-l:#e4efe3; --rain:#2f73c9; --rain-l:#dbe8f8;
  --temp:#d0632a; --wind:#5b6b7a; --warn:#b7791f; --bad:#b33a3a; --good:#2f7d46;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#171a16;--card:#22261f;--ink:#ecebe5;--mute:#a3a69c;--line:#353a31;
  --green:#3a3a3a;--green-l:#26352a;--rain:#6ea6ec;--rain-l:#1e2c3d;--temp:#f08a52;--wind:#9fb0c0}
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
header{background:var(--green);color:#fff;padding:12px 16px 0;position:sticky;top:0;z-index:5}
@media (prefers-color-scheme: dark){header{background:#000}}
header h1 svg{width:30px;height:30px}
header h1{margin:0;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-transform:uppercase;letter-spacing:.06em}
header .sub{font-size:13px;opacity:.9;margin:4px 0 8px;text-align:center}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{flex:1;background:none;border:0;color:#fff;opacity:.7;padding:10px 6px;font-size:14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{opacity:1;border-bottom-color:#fff;font-weight:600}
main{padding:12px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.mute{color:var(--mute);font-size:13px}
h2{font-size:17px;margin:0}
h3{font-size:15px;margin:12px 0 6px}
.big{font-size:22px;font-weight:650}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;font-weight:600}
.b-good{background:#e1f1e5;color:var(--good)} .b-mid{background:#fbefd9;color:var(--warn)} .b-bad{background:#f6dede;color:var(--bad)} .b-one{background:var(--line);color:var(--mute)}
@media (prefers-color-scheme: dark){.b-good{background:#203a27}.b-mid{background:#3a3020}.b-bad{background:#3d2222}}
.stats{display:flex;gap:16px;margin:8px 0}
.stat .v{font-size:18px;font-weight:650}
.stat .l{font-size:12px;color:var(--mute)}
.t-min{color:var(--rain)} .t-max{color:var(--temp)}
svg.chart{width:100%;height:auto;display:block}
.horses{display:grid;gap:8px;margin-top:10px}
.hrec{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px}
.hrec svg{width:44px;height:44px;flex:none}
.hrec .nm{font-weight:600}
.pill{display:block;width:fit-content;max-width:100%;padding:3px 9px;border-radius:8px;background:var(--green-l);font-size:13px;margin:4px 0}
.stats6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.s6{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.s6 .v{font-size:18px;font-weight:650;white-space:nowrap}
.s6 .l{font-size:12px;color:var(--mute)}
.s6 .rg{font-size:12px;font-weight:600;color:var(--ink);opacity:.75;white-space:nowrap}
details.day summary{list-style:none;cursor:pointer}
details.day summary .row{flex-wrap:nowrap;gap:6px}
details.day summary h2{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.day summary .sp{display:none}
.badge{white-space:nowrap}
details.day summary::-webkit-details-marker{display:none}
details.day .chev{font-size:18px;color:var(--mute);transition:transform .2s;margin-left:6px}
details.day[open] .chev{transform:rotate(180deg)}
details.day .resume{margin-top:4px}
details.day[open] .resume{display:none}
.pill.n{background:var(--rain-l)}
button.btn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}
button.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.btn.danger{background:var(--bad)}
button.link{background:none;border:0;color:var(--ink);font-size:14px;padding:6px 0;cursor:pointer;text-decoration:underline}
input,select{font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);width:100%}
input[type=color]{padding:2px;height:40px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mute);font-weight:600}
tr.out td{background:var(--green-l)}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.demo{background:#fff3cd;color:#6b4e00;border:1px solid #e9cf7a;border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px}
@media (prefers-color-scheme: dark){.demo{background:#3a3218;color:#f0d98a;border-color:#6b5a24}}
.err{color:var(--bad)}
.hlist{display:grid;gap:8px}
.hitem{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.hitem svg{width:56px;height:56px;flex:none}
.preview{display:flex;justify-content:center;padding:6px}
.preview svg{width:180px;height:180px}
.toggle{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.toggle button{flex:1;padding:9px;border:0;background:var(--card);color:var(--ink);font-size:14px;cursor:pointer}
.toggle button.on{background:var(--green);color:#fff}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mute);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.results button{display:block;width:100%;text-align:left;margin-top:6px}
.hidden{display:none}
button.btn.refresh{display:block;width:100%;padding:16px;font-size:17px;font-weight:650;border-radius:14px;margin:4px 0 0}
button.btn.refresh:disabled{opacity:.6}
</style>
</head>
<body>
<header>
  <h1><span id="hdrIcon"></span>Météo Chevaux</h1>
  <div class="sub" id="hdrSub">—</div>
  <nav>
    <button data-tab="prev" class="on">Prévisions</button>
    <button data-tab="bilan">Bilan 7 j</button>
    <button data-tab="chevaux">Chevaux</button>
    <button data-tab="reglages">Réglages</button>
  </nav>
</header>
<main>
  <section id="tab-prev"></section>
  <section id="tab-bilan" class="hidden"></section>
  <section id="tab-chevaux" class="hidden"></section>
  <section id="tab-reglages" class="hidden"></section>
</main>

<script>
"use strict";
/* ================= Stockage ================= */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("mc_"+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("mc_"+k, JSON.stringify(v)); }catch(e){} }
};
let settings = Object.assign({
  lieu:null,            // {name, lat, lon}
  sortieDebut:8, sortieFin:18,
  seuilPluie:1,         // mm sur la période pour considérer "pluie"
  rafaleForte:50,       // km/h : au-delà, couverture imposée
  seuils:{ nonTondu:[2,-3,-8], tondu:[12,8,3] }   // indice ≥ a : rien · ≥ b : 0 g · ≥ c : 100 g · sinon 200 g
}, store.get("settings", {}));
if(!settings.seuils || !settings.seuils.tondu) settings.seuils = {nonTondu:[2,-3,-8], tondu:[12,8,3]};
let horses = store.get("horses", []);
let wx = null;          // données météo traitées
let demo = false;
let editing = null;     // cheval en cours d'édition

/* ================= Modèles météo ================= */
const MODELS = [
  {id:"meteofrance_seamless", label:"Météo-France (AROME/ARPEGE)", short:"MF"},
  {id:"ecmwf_ifs025",         label:"ECMWF (européen)",          short:"ECMWF"},
  {id:"icon_seamless",        label:"DWD ICON (allemand)",       short:"ICON"}
];

/* ================= Indice « ressenti cheval » =================
   Par heure : indice = température + bonus soleil − malus vent − malus pluie
   - soleil : +1 °C par 100 W/m² de rayonnement solaire (max +4 °C) ; nul la nuit
   - vent   : −1 °C par 5 km/h au-delà de 10 km/h (max −8 °C)
   - pluie  : −3 °C pour une heure de pluie (≥ 0,2 mm) : poil mouillé = moins isolant
   Hors créneau de sortie (box) : ni vent ni pluie ; ciel dégagé −2 °C (−0 si couvert).
   Sur une période (jour ou nuit) on retient l'heure la plus défavorable. */
const LEVELS = ["Sans couverture","0 g imperméable","100 g","200 g"];
function dehors(o){ return o.h>=settings.sortieDebut && o.h<settings.sortieFin; }
function indiceHeure(o){
  if(!o || o.t==null) return null;
  if(!dehors(o)){                        // au box : ni vent ni pluie ; un ciel dégagé refroidit
    const ciel = 2*(1 - (o.cc==null?50:o.cc)/100);
    return {i: o.t - ciel, soleil:0, vent:0, pluie:0, ciel, box:true};
  }
  const soleil = Math.min(4, (o.sw||0)/100);
  const vent = Math.min(8, Math.max(0, ((o.ws||0)-10)/5));
  const pluie = (o.p||0) >= 0.2 ? 3 : 0;
  return {i: o.t + soleil - vent - pluie, soleil, vent, pluie, ciel:0, box:false};
}
function couverture(h, w){
  if(w.indice==null) return null;
  const [a,b,c] = h.tondu ? settings.seuils.tondu : settings.seuils.nonTondu;
  let lvl = w.indice >= a ? 0 : w.indice >= b ? 1 : w.indice >= c ? 2 : 3;
  const raisons = [];
  if(!w.box && w.pluie >= settings.seuilPluie && lvl===0){ lvl = 1; raisons.push("pluie"); }
  if(!w.box && (w.rafMax||0) >= settings.rafaleForte && lvl===0){ lvl = 1; raisons.push("vent fort"); }
  const limite = lvl===3 && w.indice < c-5;
  return {lvl, txt:LEVELS[lvl] + (raisons.length ? " ("+raisons.join(", ")+")" : "") + (limite ? " ⚠" : ""), limite};
}

  "Aubère":         {robe:"#c49a8a", crin:"#8a5a44"},
  "Rouan":          {robe:"#8f6a5a", crin:"#1e1a18"}
};
const CRINS = {"Selon la robe":null, "Noirs":"#1a1716", "Bruns":"#4a2e1e", "Roux":"#8a3a1a", "Lavés (clairs)":"#eadbb8", "Blancs":"#f7f6f2"};
const MARQUES = ["Aucune","Pelote / étoile","Fine liste","Liste","Belle face"];
function mix(hex, v){            // v de -5 (foncer) à +5 (éclaircir)
  const n = parseInt(hex.slice(1),16); let c=[n>>16&255,n>>8&255,n&255];
  const t = Math.abs(v)*0.09, to = v>0 ? 255 : 0;
  c = c.map(x => Math.round(x + (to-x)*t));
  return "#"+c.map(x=>x.toString(16).padStart(2,"0")).join("");
}
function lum(hex){ const n=parseInt(hex.slice(1),16); return 0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255); }
function couleurs(h){
  const p = ROBES[h.robeNom] || {robe:h.robe||"#7a4a2a", crin:h.crin||"#1e1a18"};
  const robe = mix(p.robe, h.nuance||0);
  const crin = CRINS[h.crinsNom] || mix(p.crin, Math.round((h.nuance||0)/2));
  return {robe, crin, oreille: mix(robe, 2), trait: lum(robe) < 70 ? "#6e6464" : "#1a1414"};
}

/* ================= Récupération météo ================= */
async function fetchWeather(){
  const {lat, lon} = settings.lieu;
  const url = "https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+
    "&hourly=temperature_2m,precipitation,cloud_cover,wind_speed_10m,wind_gusts_10m,shortwave_radiation&models="+MODELS.map(m=>m.id).join(",")+
    "&past_days=7&forecast_days=4&timezone=auto";
  const r = await fetch(url);
  if(!r.ok) throw new Error("Open-Meteo a répondu "+r.status);
  const j = await r.json();
  if(j.error) throw new Error(j.reason||"Erreur Open-Meteo");
  return j;
}
function process(j){
  const H = j.hourly, times = H.time;
  const pick = (v, m) => H[v+"_"+m] || (MODELS.length===1 ? H[v] : null);
  const VARS = {t:"temperature_2m", p:"precipitation", cc:"cloud_cover", ws:"wind_speed_10m", wg:"wind_gusts_10m", sw:"shortwave_radiation"};
  // valeur médiane des modèles : avec 3 modèles, celui qui s'écarte seul est ignoré
  const avg = a => { if(!a.length) return null; const b=[...a].sort((x,y)=>x-y), m=b.length>>1; return b.length%2 ? b[m] : (b[m-1]+b[m])/2; };
  const hours = times.map((t,i) => {
    const per = {};
    MODELS.forEach(m => {
      per[m.id] = {};
      for(const k in VARS){ const A = pick(VARS[k], m.id); per[m.id][k] = A && A[i]!=null ? A[i] : null; }
    });
    const o = {time:t, date:t.slice(0,10), h:parseInt(t.slice(11,13),10), per};
    for(const k in VARS) o[k] = avg(MODELS.map(m=>per[m.id][k]).filter(v=>v!=null));
    return o;
  });
  const byDate = {};
  hours.forEach(x => (byDate[x.date] = byDate[x.date] || []).push(x));
  const today = localToday(j.utc_offset_seconds);
  const dates = Object.keys(byDate).sort();
  const days = dates.map(d => summarize(d, byDate[d]));
  return {
    fetched: Date.now(), tz: j.timezone, today, hours, byDate,
    past: days.filter(d => d.date < today).slice(-7),
    next: days.filter(d => d.date >= today).slice(0,4)
  };
}
function localToday(offsetSec){
  const d = new Date(Date.now() + (offsetSec||0)*1000);
  return d.toISOString().slice(0,10);
}
function summarize(date, hrs){
  const vals = hrs.map(x=>x.t).filter(v=>v!=null);
  const s = {date, hrs,
    tmin: vals.length ? Math.min(...vals) : null,
    tmax: vals.length ? Math.max(...vals) : null,
    tmoy: vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null,
    pluie: hrs.reduce((a,x)=>a+(x.p||0),0),
    heuresPluie: hrs.filter(x=>(x.p||0)>=0.1).length,
    models:{}
  };
  MODELS.forEach(m => {
    const T = hrs.map(x=>x.per[m.id].t).filter(v=>v!=null);
    const P = hrs.map(x=>x.per[m.id].p).filter(v=>v!=null);
    s.models[m.id] = T.length ? {tmin:Math.min(...T), tmax:Math.max(...T), pluie:P.reduce((a,b)=>a+b,0), n:T.length} : null;
  });
  s.conf = confiance(s);
  return s;
}
function confiance(s){
  const ms = MODELS.map(m=>s.models[m.id]).filter(Boolean);
  if(ms.length < 2) return {cls:"b-one", txt:"1 seul modèle"};
  const daccord = (a,b) => {
    const dT = Math.max(Math.abs(a.tmax-b.tmax), Math.abs(a.tmin-b.tmin));
    const dR = Math.abs(a.pluie-b.pluie), rel = dR/Math.max(1,(a.pluie+b.pluie)/2);
    const sec = a.pluie < 1 && b.pluie < 1;            // deux modèles quasi secs = d'accord
    return dT<=2 && (sec || dR<=2 || rel<=0.4);
  };
  let paires = 0, ok = 0;
  for(let x=0;x<ms.length;x++) for(let y=x+1;y<ms.length;y++){ paires++; if(daccord(ms[x],ms[y])) ok++; }
  const n = ms.length;
  if(ok===paires) return {cls:"b-good", txt:"Fiable · "+n+"/"+n};
  if(ok>0)        return {cls:"b-mid",  txt:"Moyen · 2/"+n};
  return {cls:"b-bad", txt:"Incertain · 0/"+n};
}
function fourchette(d, k, fmt){              // "(a à b)" entre modèles quand la confiance n'est pas haute
  if(d.conf.cls==="b-good" || d.conf.cls==="b-one") return "";
  const v = MODELS.map(m=>d.models[m.id]).filter(Boolean).map(x=>x[k]);
  if(v.length<2) return "";
  const lo = Math.min(...v), hi = Math.max(...v);
  const l = fmt(lo).replace(/ mm$/,"").replace(/°$/,"");
  return `<div class="rg">${l} à ${fmt(hi)}</div>`;
}
/* fenêtre jour (sortie) et nuit (fin de sortie → début de sortie du lendemain) */
function windows(date){
  const all = wx.hours;
  const d0 = settings.sortieDebut, d1 = settings.sortieFin;
  const jour = all.filter(x => x.date===date && x.h>=d0 && x.h<d1);
  const next = nextDate(date);
  const nuit = all.filter(x => (x.date===date && x.h>=d1) || (x.date===next && x.h<d0));
  const agg = (arr, box) => {
    const t = arr.map(x=>x.t).filter(v=>v!=null);
    const ix = arr.map(indiceHeure).filter(Boolean);
    const pire = ix.length ? ix.reduce((a,b)=> b.i<a.i ? b : a) : null;
    const nums = k => arr.map(x=>x[k]).filter(v=>v!=null);
    const cc = nums("cc"), ws = nums("ws"), wg = nums("wg");
    return {box, n:arr.length, tmin: t.length?Math.min(...t):null, tmax: t.length?Math.max(...t):null,
            pluie: arr.reduce((a,x)=>a+(x.p||0),0), heuresPluie: arr.filter(x=>(x.p||0)>=0.1).length,
            indice: pire ? pire.i : null, pire,
            nuages: cc.length ? cc.reduce((a,b)=>a+b,0)/cc.length : null,
            ventMax: ws.length ? Math.max(...ws) : null, rafMax: wg.length ? Math.max(...wg) : null};
  };
  return {jour:agg(jour,false), nuit:agg(nuit,true)};
}
function nextDate(d){ const x = new Date(d+"T12:00:00Z"); x.setUTCDate(x.getUTCDate()+1); return x.toISOString().slice(0,10); }

/* ================= Données d'exemple ================= */
function demoData(){
  const now = new Date(); now.setMinutes(0,0,0);
  const start = new Date(now); start.setDate(start.getDate()-7); start.setHours(0);
  const time=[], h = {};
  const V = ["temperature_2m","precipitation","cloud_cover","wind_speed_10m","wind_gusts_10m","shortwave_radiation"];
  MODELS.forEach(m => V.forEach(v => h[v+"_"+m.id]=[]));
  let seed = 7; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  for(let i=0;i<11*24;i++){
    const d = new Date(start.getTime()+i*3600e3);
    const pad = n => String(n).padStart(2,"0");
    time.push(d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":00");
    const day = i/24, hr = d.getHours();
    const base = 6 + 3*Math.sin(day/2) - 2.5*Math.cos((hr-15)/24*2*Math.PI) * -1;
    const rainy = (Math.sin(day*2.3)+Math.sin(day*0.9+2)) > 0.7 || (day>8.25&&day<8.7) || (day>9.85&&day<10.15);
    MODELS.forEach((m,k) => {
      h["temperature_2m_"+m.id].push(+(base + (k===1? (day>8?1.8:0.5) : k===2 ? 0.3 : 0) + (rnd()-.5)).toFixed(1));
      const p = rainy ? Math.max(0, (rnd()*1.6 - 0.3) * (k===1? 1+(day>8?0.8:0.15) : k===2 ? 1.1 : 1)) : 0;
      h["precipitation_"+m.id].push(+p.toFixed(1));
      const cc = rainy ? 95 : Math.max(0, Math.min(100, 50 + 45*Math.sin(day*1.3+k*.3)));
      h["cloud_cover_"+m.id].push(Math.round(cc));
      const ws = Math.max(3, 14 + 12*Math.sin(day*0.8+1) + (rainy?8:0) + (rnd()-.5)*4);
      h["wind_speed_10m_"+m.id].push(+ws.toFixed(1));
      h["wind_gusts_10m_"+m.id].push(+(ws*1.7).toFixed(1));
      const el = Math.max(0, Math.sin((hr-8)/9*Math.PI));
      h["shortwave_radiation_"+m.id].push(hr>=8&&hr<=17 ? Math.round(380*el*(1-cc/110)) : 0);
    });
  }
  return {timezone:"Europe/Paris", utc_offset_seconds:-now.getTimezoneOffset()*60, hourly:Object.assign({time}, h)};
}

/* ================= Affichage ================= */
const fmtT = v => v==null ? "–" : (Math.round(v*10)/10).toFixed(1).replace(".",",")+"°";
const fmtP = v => v==null ? "–" : (Math.round(v*10)/10).toFixed(1).replace(".",",")+" mm";
const JOURS = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const MOIS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function dayLabel(d){
  const x = new Date(d+"T12:00:00Z");
  const base = JOURS[x.getUTCDay()]+" "+x.getUTCDate()+" "+MOIS[x.getUTCMonth()];
  if(wx && d===wx.today) return "Aujourd'hui · "+base;
  if(wx && d===nextDate(wx.today)) return "Demain · "+base;
  return base.charAt(0).toUpperCase()+base.slice(1);
}

function chartSVG(day){
  const W=340, Hh=160, L=28, R=28, T=10, B=22, iw=W-L-R, ih=Hh-T-B;
  const hrs = day.hrs;
  const maxP = Math.max(2, ...hrs.map(x=>x.p||0));
  const ts = hrs.map(x=>x.t).concat(hrs.map(x=>{const v=indiceHeure(x);return v?v.i:null;})).filter(v=>v!=null);
  const tlo = Math.floor((Math.min(...ts)-0.5)/2)*2, thi = Math.ceil((Math.max(...ts)+0.5)/2)*2;
  const bw = iw/24;
  const x = h => L + h*bw;
  const yP = p => T+ih - (p/maxP)*ih;
  const yT = t => T+ih - ((t-tlo)/(thi-tlo))*ih;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${Hh}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<rect x="${x(settings.sortieDebut)}" y="${T}" width="${(settings.sortieFin-settings.sortieDebut)*bw}" height="${ih}" fill="var(--green-l)"/>`;
  [0,6,12,18,24].forEach(h => {
    s += `<line x1="${x(h)}" x2="${x(h)}" y1="${T}" y2="${T+ih}" stroke="var(--line)"/>`;
    s += `<text x="${x(h)}" y="${Hh-6}" font-size="10" text-anchor="middle" fill="var(--mute)">${h}h</text>`;
  });
  for(let g = Math.ceil(tlo/2)*2; g <= thi; g += 2){
    s += `<line x1="${L}" x2="${W-R}" y1="${yT(g)}" y2="${yT(g)}" stroke="var(--line)" stroke-width="${g===0?1.4:0.8}" ${g===0?'stroke-dasharray="3 2"':''}/>`;
    s += `<text x="${L-3}" y="${yT(g)+3}" font-size="9" text-anchor="end" fill="var(--temp)">${g}°</text>`;
  }
  hrs.forEach(o => {
    if((o.p||0) > 0) s += `<rect x="${x(o.h)+1}" y="${yP(o.p)}" width="${bw-2}" height="${T+ih-yP(o.p)}" fill="var(--rain)" rx="1.5"><title>${o.h}h : ${fmtP(o.p)}</title></rect>`;
  });
  const pts = hrs.filter(o=>o.t!=null).map(o => `${x(o.h)+bw/2},${yT(o.t)}`).join(" ");
  s += `<polyline points="${pts}" fill="none" stroke="var(--temp)" stroke-width="2.2" stroke-linejoin="round"/>`;
  const pts2 = hrs.filter(o=>indiceHeure(o)).map(o => `${x(o.h)+bw/2},${yT(indiceHeure(o).i)}`).join(" ");
  s += `<polyline points="${pts2}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="4 3" stroke-linejoin="round" opacity=".75"/>`;
  s += `<text x="${W-2}" y="${T+8}" font-size="10" text-anchor="end" fill="var(--rain)">${maxP.toFixed(1).replace(".",",")}</text><text x="${W-2}" y="${T+ih}" font-size="10" text-anchor="end" fill="var(--rain)">0 mm</text>`;
  if(wx && day.date===wx.today){
    const now = new Date().getHours() + new Date().getMinutes()/60;
    s += `<line x1="${x(now)}" x2="${x(now)}" y1="${T}" y2="${T+ih}" stroke="var(--ink)" stroke-dasharray="2 2"/>`;
  }
  return s + `</svg>`;
}

function detailIndice(nom, p){
  const pre = nom ? nom+" : " : "";
  if(!p) return pre+"–";
  const f = v => (Math.round(v*10)/10).toFixed(1).replace(".",",");
  const parts = [];
  if(p.soleil>0.05) parts.push("soleil +"+f(p.soleil));
  if(p.vent>0.05) parts.push("vent −"+f(p.vent));
  if(p.pluie) parts.push("pluie −3");
  if(p.ciel>0.05) parts.push("ciel dégagé −"+f(p.ciel));
  if(p.box) parts.unshift("au box");
  return pre+(parts.length ? parts.join(", ") : "sans correction");
}

    <div class="preview" id="pv">${headSVG(h)}</div>
    <label>Nom</label><input id="f-name" value="${esc(h.name)}" placeholder="Nom du cheval">
    <label>Tonte</label>
    <div class="toggle"><button data-t="0" class="${!h.tondu?"on":""}">Non tondu</button><button data-t="1" class="${h.tondu?"on":""}">Tondu</button></div>
    <label>Robe</label>
    <select id="f-robe">${Object.keys(ROBES).map(k=>`<option ${k===h.robeNom?"selected":""}>${k}</option>`).join("")}</select>
    <label>Nuance : <span id="f-nv">${nuanceTxt(h.nuance||0)}</span></label>
    <div class="row"><span class="mute">Foncer</span><input type="range" id="f-nuance" min="-5" max="5" step="1" value="${h.nuance||0}" style="flex:1"><span class="mute">Éclaircir</span></div>
    <label>Crins</label>
    <select id="f-crins">${Object.keys(CRINS).map(k=>`<option ${k===(h.crinsNom||"Selon la robe")?"selected":""}>${k}</option>`).join("")}</select>
    <label>Marque en tête</label>
    <select id="f-marque">${MARQUES.map(m=>`<option ${m===(ANCIENNES_MARQUES[h.marque]||h.marque)?"selected":""}>${m}</option>`).join("")}</select>
    <label style="display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px"><input type="checkbox" id="f-nez" style="width:auto" ${h.nezBlanc?"checked":""}> Bout du nez blanc</label>
    <label style="display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px"><input type="checkbox" id="f-ladre" style="width:auto" ${h.ladre?"checked":""}> Ladre (peau rose sur le nez)</label>
    <div class="row" style="margin-top:16px">
      <button class="btn" id="f-save">Enregistrer</button><button class="btn sec" id="f-cancel">Annuler</button>
      <span class="sp"></span>${h._new?"":`<button class="btn danger" id="f-del">Supprimer</button>`}
    </div>
    <div id="f-msg" class="err"></div>
  </div>`;
}
function bindForm(){
  const h = editing, pv = () => document.getElementById("pv").innerHTML = headSVG(h);
  const $ = id => document.getElementById(id);
  $("f-name").oninput = e => h.name = e.target.value;
  document.querySelectorAll(".toggle button").forEach(b => b.onclick = () => {
    h.tondu = b.dataset.t==="1"; document.querySelectorAll(".toggle button").forEach(x=>x.classList.toggle("on", x===b)); pv(); });
  $("f-robe").onchange = e => { h.robeNom = e.target.value; pv(); };
  $("f-nuance").oninput = e => { h.nuance = +e.target.value; $("f-nv").textContent = nuanceTxt(h.nuance); pv(); };
  $("f-crins").onchange = e => { h.crinsNom = e.target.value; pv(); };
  $("f-nez").onchange = e => { h.nezBlanc = e.target.checked; pv(); };
  $("f-ladre").onchange = e => { h.ladre = e.target.checked; pv(); };
  $("f-marque").onchange = e => { h.marque = e.target.value; pv(); };
  $("f-cancel").onclick = () => { editing=null; renderChevaux(); };
  $("f-save").onclick = () => {
    if(!h.name.trim()){ $("f-msg").textContent = "Donne un nom au cheval."; return; }
    h.name = h.name.trim(); const isNew = h._new; delete h._new;
    if(isNew) horses.push(h); else horses = horses.map(x => x.id===h.id ? h : x);
    store.set("horses", horses); editing=null; renderAll();
  };
  const del = $("f-del");
  if(del) del.onclick = () => {
    if(del.dataset.armed){ horses = horses.filter(x=>x.id!==h.id); store.set("horses",horses); editing=null; renderAll(); }
    else { del.dataset.armed="1"; del.textContent="Confirmer ?"; }
  };
}

function seuilsForm(k, titre){
  const s = settings.seuils[k], inp = i => `<input type="number" step="0.5" data-seuil="${k}:${i}" value="${s[i]}" style="width:70px;padding:6px">`;
  return `<h3>${titre}</h3><table>
    <tr><td>Ressenti ≥ ${inp(0)}°</td><td>${LEVELS[0]}</td></tr>
    <tr><td>Ressenti ≥ ${inp(1)}°</td><td>${LEVELS[1]}</td></tr>
    <tr><td>Ressenti ≥ ${inp(2)}°</td><td>${LEVELS[2]}</td></tr>
    <tr><td>En dessous</td><td>${LEVELS[3]}</td></tr></table>`;
}
function renderReglages(){
  const el = document.getElementById("tab-reglages");
  const opts = n => Array.from({length:24},(_,i)=>`<option value="${i}" ${i===n?"selected":""}>${i}h</option>`).join("");
  el.innerHTML = `<div class="card">
    <h2>Lieu du pré</h2>
    <div class="mute" style="margin:4px 0">${settings.lieu ? esc(settings.lieu.name)+" ("+settings.lieu.lat.toFixed(3)+", "+settings.lieu.lon.toFixed(3)+")" : "Non défini"}</div>
    <label>Chercher une commune</label>
    <div class="row"><input id="q" placeholder="ex. Pau" style="flex:1"><button class="btn" id="qgo">OK</button></div>
    <div class="results" id="res"></div>
    <button class="btn sec" id="geo" style="margin-top:10px">📍 Utiliser ma position actuelle</button>
    <div id="geomsg" class="mute"></div>
  </div>
  <div class="card">
    <h2>Heures de sortie</h2>
    <div class="grid2"><div><label>Sortie au pré</label><select id="s1">${opts(settings.sortieDebut)}</select></div>
    <div><label>Rentrée</label><select id="s2">${opts(settings.sortieFin)}</select></div></div>
    <label>Seuil de pluie sur une période (mm)</label>
    <select id="sp">${[0.2,0.5,1,2,3,5].map(v=>`<option value="${v}" ${v===settings.seuilPluie?"selected":""}>${String(v).replace(".",",")} mm</option>`).join("")}</select>
  </div>
  <div class="card">
    <h2>Ressenti cheval</h2>
    <div class="mute" style="margin:4px 0 8px">Pour chaque heure : température <b>+ soleil</b> (+1° par 100 W/m², max +4°) <b>− vent</b> (−1° par 5 km/h au-delà de 10 km/h, max −8°) <b>− pluie</b> (−3° si l'heure est pluvieuse). Hors créneau de sortie, les chevaux sont au box : ni vent ni pluie, mais un ciel dégagé retire jusqu'à 2° (0 si couvert). Sur le jour ou la nuit, on retient l'heure la plus défavorable.</div>
    <h2 style="margin-top:14px">Seuils de couverture</h2>
    <div class="mute" style="margin:4px 0">Couvertures disponibles : 0 g imperméable, 100 g, 200 g.</div>
    ${seuilsForm("nonTondu","Non tondu")}${seuilsForm("tondu","Tondu")}
    <label>Rafales qui imposent une couverture (km/h)</label>
    <input type="number" id="raf" value="${settings.rafaleForte}" inputmode="numeric">
    <div class="mute" style="margin-top:8px">Au pré, la pluie (≥ seuil) ou des rafales fortes imposent au minimum la 0 g imperméable.</div>
    <button class="link" id="resetSeuils">Revenir aux seuils par défaut</button>
  </div>
  <div class="card mute" style="font-size:13px">Sources : Open-Meteo, 3 modèles indépendants : Météo-France (AROME 1,5 km sur 2 jours, puis ARPEGE), ECMWF (centre européen) et ICON (service météo allemand). Les valeurs affichées sont la médiane des trois : un modèle isolé est écarté. Deux modèles sont « d'accord » si leurs températures mini et maxi diffèrent de 2° au plus, et si leur pluie est sous 1 mm pour les deux, ou diffère de 2 mm ou 40 % au plus. Confiance haute : les 3 d'accord ; moyenne : au moins une paire d'accord ; faible : aucune. Sauf en confiance haute, la fourchette entre modèles s'affiche sous la valeur.</div>`;
  const $ = id => document.getElementById(id);
  const save = () => { store.set("settings", settings); wx && renderAll(); };
  $("s1").onchange = e => { settings.sortieDebut = +e.target.value; save(); };
  $("s2").onchange = e => { settings.sortieFin = +e.target.value; save(); };
  $("sp").onchange = e => { settings.seuilPluie = +e.target.value; save(); };
  $("raf").onchange = e => { settings.rafaleForte = +e.target.value || 50; save(); };
  el.querySelectorAll("[data-seuil]").forEach(inp => inp.onchange = () => {
    const [k,i] = inp.dataset.seuil.split(":"); const v = parseFloat(inp.value.replace(",","."));
    if(!isNaN(v)){ settings.seuils[k][+i] = v; save(); renderReglages(); }
  });
  $("resetSeuils").onclick = () => { settings.seuils = {nonTondu:[2,-3,-8], tondu:[12,8,3]}; settings.rafaleForte = 50; save(); renderReglages(); };
  const search = async () => {
    const q = $("q").value.trim(); if(!q) return;
    $("res").innerHTML = `<div class="mute">Recherche…</div>`;
    try{
      const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=6&language=fr&name="+encodeURIComponent(q));
      const j = await r.json();
      if(!j.results || !j.results.length){ $("res").innerHTML = `<div class="mute">Aucun résultat.</div>`; return; }
      $("res").innerHTML = j.results.map((x,i)=>`<button class="btn sec" data-i="${i}">${esc(x.name)} <span class="mute">${esc([x.admin2||x.admin1, x.country].filter(Boolean).join(", "))}</span></button>`).join("");
      $("res").querySelectorAll("button").forEach(b => b.onclick = () => {
        const x = j.results[+b.dataset.i]; setLieu({name:x.name+(x.admin2?" ("+x.admin2+")":""), lat:x.latitude, lon:x.longitude});
      });
    }catch(e){ $("res").innerHTML = `<div class="err">Recherche impossible (connexion ?).</div>`; }
  };
  $("qgo").onclick = search; $("q").onkeydown = e => { if(e.key==="Enter") search(); };
  $("geo").onclick = () => {
    if(!navigator.geolocation){ $("geomsg").textContent = "Position non disponible sur cet appareil."; return; }
    $("geomsg").textContent = "Localisation…";
    navigator.geolocation.getCurrentPosition(
      p => setLieu({name:"Ma position", lat:p.coords.latitude, lon:p.coords.longitude}),
      () => $("geomsg").textContent = "Position refusée ou indisponible. Utilise la recherche de commune.",
      {enableHighAccuracy:true, timeout:15000});
  };
}
function setLieu(l){ settings.lieu = l; store.set("settings", settings); demo=false; wx=null; load(true); switchTab("prev"); }

function noLieu(){
  return `<div class="card"><h2>Bienvenue</h2><p>Indique d'abord où se trouve le pré, dans <b>Réglages</b>.</p>
  <button class="btn" onclick="switchTab('reglages')">Choisir le lieu</button>
  <p class="mute" style="margin-top:14px">Ou regarde d'abord le rendu :</p><button class="btn sec" onclick="startDemo()">Voir avec des données d'exemple</button></div>`;
}
function demoBanner(){ return demo ? `<div class="demo"><b>Données d'exemple, pas la vraie météo.</b> Elles servent seulement à voir le rendu. Choisis le lieu dans Réglages pour avoir la vraie météo.</div>` : ""; }
function startDemo(){ demo = true; wx = process(demoData()); renderAll(); }

function renderAll(){ renderPrev(); renderBilan(); renderChevaux(); renderReglages();
  document.getElementById("hdrSub").textContent = demo ? "📌 Mode exemple" : settings.lieu ? "📌 "+settings.lieu.name : "📌 Lieu non défini";
}
function switchTab(t){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===t));
  document.querySelectorAll("main > section").forEach(s=>s.classList.toggle("hidden", s.id!=="tab-"+t));
  window.scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => switchTab(b.dataset.tab));

async function load(force){
  if(!settings.lieu){ renderAll(); return; }
  const cache = store.get("cache", null);
  const sameLieu = cache && cache.v===3 && cache.lat===settings.lieu.lat && cache.lon===settings.lieu.lon;
  if(sameLieu && !wx){ wx = process(cache.raw); wx.fetched = cache.at; }
  renderAll();
  if(!force && sameLieu && Date.now()-cache.at < 30*60e3) return;   // cache 30 min
  try{
    const raw = await fetchWeather();
    store.set("cache", {v:3, lat:settings.lieu.lat, lon:settings.lieu.lon, at:Date.now(), raw});
    wx = process(raw); demo=false; renderAll();
  }catch(e){
    const el = document.getElementById("tab-prev");
    const msg = `<div class="card err">Impossible de récupérer la météo : ${esc(e.message)}.${wx?" Affichage des dernières données enregistrées.":""}<br><button class="btn sec" style="margin-top:8px" onclick="startDemo()">Voir avec des données d'exemple</button></div>`;
    el.insertAdjacentHTML("afterbegin", msg);
  }
}

document.getElementById("hdrIcon").innerHTML = headSVG({robeNom:"Gris clair / blanc", name:"Météo Chevaux"});
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  try{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
}
load(false);
// Mise à jour automatique : au retour sur l'appli et toutes les 30 min
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible" && !demo) load(false); });
setInterval(() => { if(document.visibilityState==="visible" && !demo) load(false); }, 30*60e3);
</script>
</body>
</html>
